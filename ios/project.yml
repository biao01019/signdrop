name: SignKit

options:
  bundleIdPrefix: com.signkit
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  SignKit:
    path: SignKit

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"

targets:
  SignKitApp:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
    # 不用 GENERATE_INFOPLIST_FILE：INFOPLIST_KEY_ 只支持固定的一批键，
    # UIFileSharingEnabled / LSSupportsOpeningDocumentsInPlace 会被静默丢弃。
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 自签助手
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_NAME: SignKit
        PRODUCT_BUNDLE_IDENTIFIER: com.signkit.app
        # App 模块名不能与 SignKit 库同名，否则两者产物会写到同一个 .swiftmodule
        PRODUCT_MODULE_NAME: SigndropApp
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
      configs:
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
    dependencies:
      - package: SignKit
        product: SignKit

schemes:
  SignKitApp:
    build:
      targets:
        SignKitApp: all
    run:
      config: Debug
    archive:
      config: Release
